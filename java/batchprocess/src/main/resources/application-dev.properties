author.table.new.records=UPDATE  tablename SET  RECORD_STATUS = 'PROCESSING',UPDATED_DATE = GETDATE(),UPDATED_BY='Batch_Component' OUTPUT inserted.* WHERE  SPOTIFY_DATA_TIME_INTERVAL_ID = ? AND ( ( RECORD_STATUS = 'NEW' ) or ( RECORD_STATUS = 'PROCESSING' AND  UPDATED_DATE <= DATEADD(MINUTE, -30, GETDATE()) )  );
#author.table.new.records=UPDATE  tablename SET  RECORD_STATUS = 'PROCESSING',UPDATED_DATE = GETDATE(),UPDATED_BY='Batch_Component' OUTPUT inserted.* WHERE ( RECORD_STATUS = 'PROCESSING' ) ;
conversation.table.actionlogs=SELECT * FROM tablename WHERE SPOTIFY_DATA_TIME_INTERVAL_ID = ?  AND TIME_PERIOD = ? AND CONVERSATION_ID = ?
conversation.table.actionlogsV2= SELECT  CONVERSATION_ID, STRING_AGG( CASE WHEN  ACTION_PERFORMED LIKE '%Tag Attached%' THEN ACTING_AGENT + ' Attached tag : ' + TAGS + ' at ' + CONVERT(NVARCHAR(30), ACTION_PERFORMEDDATE, 120) ELSE ' ' + ACTING_AGENT + ' ' + ACTION_PERFORMED + ' ' + COALESCE(HISTORY_ACTION,'')  END, '\n' ) AS CONCATENATED_ACTIONS FROM  tablename where SPOTIFY_DATA_TIME_INTERVAL_ID = ?  AND CONVERSATION_ID in (idslist)  GROUP BY CONVERSATION_ID;
playvox.table.insert=INSERT INTO INTERACTION_STATUS (SPOTIFY_DATA_TIME_INTERVAL_ID,PLAYVOX_ACKNOWLEDGEMENT_ID,RECORD_STATUS,CREATED_DATE,CREATED_BY) VALUES (?,?,?,?,?)
author.table.update=UPDATE tablename SET PLAYVOX_ACKNOWLEDGEMENT_ID = CASE WHEN PLAYVOX_ACKNOWLEDGEMENT_ID IS NULL THEN ?  WHEN PLAYVOX_ACKNOWLEDGEMENT_ID like ? THEN PLAYVOX_ACKNOWLEDGEMENT_ID  ELSE CONCAT( PLAYVOX_ACKNOWLEDGEMENT_ID,',' ,?) END,RECORD_STATUS=?, UPDATED_DATE = ? , UPDATED_BY = ?,QUEUE_ID = ?  WHERE TIME_PERIOD = ? AND LITHIUM_UUID = ?
interval.table.records.latest=SELECT * FROM SPOTIFY_DATA_TIME_INTERVALS WHERE END_TIME =(  SELECT  MIN(t.END_TIME) AS END_TIME FROM SPOTIFY_DATA_TIME_INTERVALS t WHERE ACTION_LOG_STATUS = 'COMPLETED' AND AUTHOR_STATUS = 'COMPLETED' AND BATCH_PROCESS_STATUS = 'NEW') 
interval.table.update=UPDATE SPOTIFY_DATA_TIME_INTERVALS SET BATCH_PROCESS_STATUS = ?,BATCH_STATUS_UPDATED_AT = ? WHERE ID = ?
author.table.unprocessedRecords=  SELECT COUNT(ID) FROM tablename WHERE SPOTIFY_DATA_TIME_INTERVAL_ID = ? AND RECORD_STATUS NOT IN ('COMPLETED','QUEUE_NOT_CONFIGURED')
batch.interval.retry.limit=3


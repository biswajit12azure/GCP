author.table.schema=CREATE TABLE AUTHOR_ (ID  BIGINT IDENTITY(1,1) PRIMARY KEY,TIME_PERIOD  VARCHAR(255),SPOTIFY_DATA_TIME_INTERVAL_ID BIGINT,LITHIUM_UUID VARCHAR(255),AUTHOR_NOTES NVARCHAR(max),CONVERSATION_IDS VARCHAR(MAX),QUEUE_ID TEXT,USERNAMES VARCHAR(500),TWITTER_HANDLES VARCHAR(500),FACEBOOK_DISPLAY_NAMES VARCHAR(500),GOOGLE_MESSENGER_DISPLAY_NAMES VARCHAR(500),INSTAGRAM_HANDLES VARCHAR(500),YOUTUBE_HANDLES VARCHAR(500),LINKEDIN_HANDLES VARCHAR(500),SMS_HANDLES VARCHAR(500),WECHAT_NAMES VARCHAR(500),RECORD_STATUS VARCHAR(50),PLAYVOX_ACKNOWLEDGEMENT_ID TEXT, CREATED_DATE DATETIME NOT NULL,CREATED_BY VARCHAR(20) NOT NULL,UPDATED_DATE DATETIME,UPDATED_BY VARCHAR(20) INDEX idx_SPOTIFY_DATA_TIME_INTERVAL_ID (SPOTIFY_DATA_TIME_INTERVAL_ID));
author.table.defaultName=AUTHOR
author.table.rename=EXEC sp_rename 'oldName', 'newName';
author.table.insert=INSERT INTO tablename (  "LITHIUM_UUID", "AUTHOR_NOTES", "CONVERSATION_IDS", "USERNAMES", "TWITTER_HANDLES", "FACEBOOK_DISPLAY_NAMES", "GOOGLE_MESSENGER_DISPLAY_NAMES", "INSTAGRAM_HANDLES", "YOUTUBE_HANDLES", "LINKEDIN_HANDLES", "SMS_HANDLES", "WECHAT_NAMES", "RECORD_STATUS",TIME_PERIOD,"CREATED_DATE","CREATED_BY","SPOTIFY_DATA_TIME_INTERVAL_ID") VALUES (  ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,?,?,?,?);
interval.table.update=UPDATE SPOTIFY_DATA_TIME_INTERVALS SET AUTHOR_STATUS = ?,AUTHOR_STATUS_UPDATED_AT = ? WHERE ID = ?
interval.table.records.latest=SELECT * FROM SPOTIFY_DATA_TIME_INTERVALS WHERE END_TIME =(  SELECT  MIN(t.END_TIME) AS END_TIME FROM SPOTIFY_DATA_TIME_INTERVALS t WHERE ACTION_LOG_STATUS = 'COMPLETED' AND AUTHOR_STATUS = 'NEW') 

khoros.interval.retry.limit=3
retry.policy.count=4
retry.policy.timeperiod=20000